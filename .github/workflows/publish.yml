name: Publish to npm

on:
  release:
    types: [published]
  # Re-run by hand (for example to finish the MCP Registry listing); a version
  # npm already has is not published again.
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - run: npm run release:check
      - name: Verify package builds correctly
        run: npm pack --dry-run

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Package version ($PKG_VERSION) does not match release tag (${{ github.event.release.tag_name }})"
            exit 1
          fi

      - name: Publish with npm trusted publishing
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "baton-run@$VERSION" version >/dev/null 2>&1; then
            echo "baton-run@$VERSION is already on npm."
          else
            npm publish --access public
          fi

      # The MCP Registry lists the same version, read from server.json. It
      # checks that npm carries baton-run@<version> with a matching mcpName.
      - name: List the version on the MCP Registry
        env:
          MCP_PUBLISHER: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          # npm takes a few minutes to serve a new version, and the registry
          # checks npm, so wait for it first.
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            npm view "baton-run@$VERSION" version --prefer-online >/dev/null 2>&1 && break
            echo "Waiting for npm to serve baton-run@$VERSION ($i/30)"; sleep 20
          done
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
