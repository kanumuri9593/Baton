<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 64" width="246" height="64" role="img" aria-label="Baton">
  <title>Baton</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b7cff"/>
      <stop offset=".5" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#25c6bd"/>
    </linearGradient>
    <!-- The lanes run behind the baton, so they are cut where it sweeps across. -->
    <mask id="sweep">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M14.5 50.5 L54 10" stroke="#000" stroke-width="13.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <g mask="url(#sweep)" stroke="#fff" stroke-opacity=".62" stroke-width="6" stroke-linecap="round">
    <path d="M13 20 H44"/><path d="M13 32 H52"/><path d="M31 44 H49"/>
  </g>
  <path d="M16.86 52.8 L54 10 L12.14 48.2 Z" fill="#fff"/>
  <circle cx="14.5" cy="50.5" r="4.6" fill="#fff"/>
  <text x="80" y="43" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="34" font-weight="650" letter-spacing="-0.5" fill="currentColor">baton</text>
</svg>
