<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Baton mark">
  <title>Baton</title>
  <defs>
    <linearGradient id="lane-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <mask id="mark-lane-mask">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M15 51 L52 11" stroke="#000" stroke-width="10" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- Three lanes representing running processes -->
  <g mask="url(#mark-lane-mask)" stroke="url(#lane-gradient)" stroke-width="4" stroke-linecap="round">
    <path d="M12 20 H42"/>
    <path d="M12 32 H50"/>
    <path d="M28 44 H50"/>
  </g>
  <!-- Conductor's baton - uses currentColor for theme adaptability -->
  <path d="M15 51 L52 11" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="14" cy="52" rx="5" ry="4" fill="currentColor" transform="rotate(-8 14 52)"/>
</svg>
