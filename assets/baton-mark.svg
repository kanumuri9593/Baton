<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Baton mark">
  <title>Baton</title>
  <defs>
    <linearGradient id="arc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Three signal arcs - gradient colored for theme adaptation -->
  <g fill="none" stroke="url(#arc-grad)" stroke-width="15" stroke-linecap="round" opacity="0.7">
    <path d="M 195 115 C 145 145, 125 195, 125 255"/>
    <path d="M 225 75 C 155 115, 115 185, 115 295"/>
    <path d="M 255 40 C 165 85, 105 175, 105 335"/>
  </g>
  
  <!-- Baton - uses currentColor for light/dark theme adaptation -->
  <line x1="150" y1="385" x2="385" y2="140" stroke="currentColor" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Pommel -->
  <circle cx="138" cy="397" r="34" fill="currentColor"/>
</svg>
