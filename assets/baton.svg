<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Baton">
  <title>Baton</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Squircle background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Signal arcs (three broadcast lines) -->
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path d="M44 16 Q52 24 44 32"/>
    <path d="M48 12 Q60 24 48 36"/>
    <path d="M52 8 Q68 24 52 40"/>
  </g>
  <!-- Conductor's baton -->
  <line x1="16" y1="52" x2="48" y2="20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="14" cy="54" r="5" fill="#fff"/>
</svg>
