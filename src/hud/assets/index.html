<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baton</title>
<link rel="icon" href="%%FAVICON%%">
<link rel="stylesheet" href="/assets/hud.css">
<link rel="modulepreload" href="/assets/filters.js">
</head>
<body data-density="chip">
<aside id="chip" class="baton-chip baton-chip--icon" data-appearance="system" title="Baton — click to open or drag to move">
  <div class="chip-face" id="chipFace" role="button" tabindex="0" title="Open Baton">
    <span class="baton-chip__mark" id="chipMark">%%CHIP_MARK%%</span>
    <span class="baton-chip__count" id="chipCount"></span>
  </div>
  <div id="peek">
    <select id="peekSession" title="Active session"></select>
    <span class="peek-meta" id="peekMeta"></span>
    <span class="peek-actions" id="peekActions"></span>
  </div>
  <button class="icon" id="chipExpand" title="Expand inspector"></button>
</aside>

<div id="hudMain">
<header class="baton-topnav">
  <div class="baton-topnav__brand">%%MARK%%<span>Baton</span><small id="status">connecting…</small></div>
  <span class="baton-topnav__spacer"></span>
  <button class="baton-topnav__tab" id="diagnoseBtn" title="Search errors and requests across projects">Diagnose</button>
  <button class="baton-topnav__tab" id="refreshProjects" title="Re-read project launch configurations from disk">Refresh</button>
  <button class="baton-topnav__tab" id="historyBtn" title="Past runs, persisted on disk -- survives a daemon restart">History</button>
  <button class="baton-topnav__action" id="reloadAll" title="Hot reload every running session (r)"></button>
  <button class="baton-topnav__action" id="restartAll" title="Hot restart every running session (R)"></button>
  <button class="baton-topnav__action danger" id="stopAll" title="Stop every running session"></button>
</header>

<nav id="tabs"></nav>

<div class="history" id="historyPanel" hidden>
  <div class="history-list" id="historyList"></div>
  <div class="logs" id="historyLogs"></div>
</div>

<div class="launcher" id="addRow" hidden>
  <input type="text" id="addPath" placeholder="~/code/my-app — path to another project" spellcheck="false">
  <button class="go" id="addGo">Add</button>
  <button id="addCancel">Cancel</button>
</div>

<div class="launcher">
  <select id="picker" aria-label="Environment or launch target"><option value="">Loading targets…</option></select>
  <select id="checkout" aria-label="Branch or checkout" title="Checkout"><option value="">This checkout</option></select>
  <select id="device" aria-label="Device or simulator" title="Device"><option value="">Auto</option></select>
  <button class="go" id="run">Run</button>
</div>

<section id="launchGuide" class="launch-guide" aria-live="polite"></section>

<section id="diagnostics" class="launch-guide" hidden></section>
<main id="list"></main>
</div>

<div class="gutter" id="splitOuter" role="separator" aria-orientation="vertical" title="Resize Logs"></div>
<section id="inspector"></section>
<div class="toast" id="toast"></div>

<script>window.BATON_TOKEN='%%TOKEN%%';</script>
<script src="/assets/icons.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/diagnostics.js"></script>
<script src="/assets/network.js"></script>
<script src="/assets/editor.js"></script>
<script type="module" src="/assets/inspector.js"></script>
</body>
</html>
