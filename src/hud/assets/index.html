<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baton</title>
<link rel="icon" href="%%FAVICON%%">
<link rel="stylesheet" href="/assets/hud.css">
<link rel="modulepreload" href="/assets/filters.js">
<link rel="modulepreload" href="/assets/workspace.js">
</head>
<body data-density="chip" data-rail="open">
<aside id="chip" title="Baton — click to open or drag to move">
  <div class="chip-face" id="chipFace" role="button" tabindex="0" title="Open Baton" data-state="idle">
    <span class="chip-tile" id="chipTile" aria-hidden="true">%%CHIP_TILE%%</span>
    <span class="chip-mark" id="chipMark">%%CHIP_MARK%%</span>
    <span id="chipCount"></span>
  </div>
  <div id="peek">
    <select id="peekSession" title="Active session"></select>
    <span class="peek-meta" id="peekMeta"></span>
    <span class="peek-actions" id="peekActions"></span>
  </div>
  <nav id="tabs" aria-label="Projects and workspaces"></nav>
  <button class="icon" id="chipExpand" title="Expand inspector"></button>
</aside>

<div id="hudMain">
<header>
  <div class="brand">%%MARK%%<div>Baton<small id="status">connecting…</small></div></div>
  <span class="spacer"></span>
  <button id="diagnoseBtn" title="Search errors and requests across projects">Diagnose</button>
  <button id="refreshProjects" title="Re-read project launch configurations from disk">Refresh</button>
  <button id="historyBtn" title="Past runs, persisted on disk -- survives a daemon restart">History</button>
  <button class="icon" id="settingsBtn" title="Settings (Command-,)" aria-label="Settings"></button>
  <button class="icon" id="reloadAll" title="Hot reload every running session (r)"></button>
  <button class="icon" id="restartAll" title="Hot restart every running session (R)"></button>
  <button class="icon danger" id="stopAll" title="Stop every running session"></button>
</header>

<div class="history" id="historyPanel" hidden>
  <div class="history-list" id="historyList"></div>
  <div class="logs" id="historyLogs"></div>
</div>

<div class="launcher" id="addRow" hidden>
  <input type="text" id="addPath" placeholder="~/code/my-app — path to another project" spellcheck="false">
  <button class="go" id="addGo">Add</button>
  <button id="addCancel">Cancel</button>
</div>

<div class="launcher">
  <select id="picker" aria-label="Environment or launch target"><option value="">Loading targets…</option></select>
  <select id="checkout" aria-label="Branch or checkout" title="Checkout"><option value="">This checkout</option></select>
  <select id="device" aria-label="Device or simulator" title="Device"><option value="">Auto</option></select>
  <button class="go" id="run">Run</button>
</div>

<section id="launchGuide" class="launch-guide" aria-live="polite"></section>

<section id="diagnostics" class="launch-guide" hidden></section>
<main id="list"></main>
</div>

<div class="gutter" id="splitOuter" role="separator" aria-orientation="vertical" title="Resize Logs"></div>
<section id="inspector"></section>
<div class="toast" id="toast"></div>

<div class="settings-backdrop" id="settingsPanel" hidden>
  <section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <header class="settings-head">
      <div>
        <h2 id="settingsTitle">Settings</h2>
        <p>Preferences for this Baton control panel.</p>
      </div>
      <button class="icon" id="settingsClose" aria-label="Close settings"></button>
    </header>
    <div class="settings-body">
      <fieldset>
        <legend>Appearance</legend>
        <label class="settings-row">
          <span><strong>Theme</strong><small>Match your system, or choose a fixed appearance.</small></span>
          <select id="themePreference">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="settings-row">
          <span><strong>Motion</strong><small>Reduce non-essential status animation.</small></span>
          <select id="motionPreference">
            <option value="system">System</option>
            <option value="reduce">Reduced</option>
            <option value="full">Full</option>
          </select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Window &amp; startup</legend>
        <label class="settings-row">
          <span><strong>Open as</strong><small>Choose the view shown when Baton starts.</small></span>
          <select id="startupViewPreference">
            <option value="last">Last used view</option>
            <option value="chip">Compact launcher</option>
            <option value="inspector">Control panel</option>
          </select>
        </label>
        <label class="settings-row settings-check">
          <span><strong>Keep control panel on top</strong><small>Compact mode always floats. Available in the macOS app.</small></span>
          <input type="checkbox" id="alwaysOnTopPreference">
        </label>
        <label class="settings-row settings-check">
          <span><strong>Launch at login</strong><small>Start Baton after you sign in. Available in the macOS app.</small></span>
          <input type="checkbox" id="launchAtLoginPreference">
        </label>
      </fieldset>
      <fieldset>
        <legend>Behavior</legend>
        <label class="settings-row settings-check">
          <span><strong>Restore last project</strong><small>Return to the project you viewed most recently.</small></span>
          <input type="checkbox" id="restoreProjectPreference">
        </label>
        <label class="settings-row settings-check">
          <span><strong>Confirm Stop all</strong><small>Protect every running session from an accidental click.</small></span>
          <input type="checkbox" id="confirmStopAllPreference">
        </label>
      </fieldset>
      <div class="settings-note">
        <strong>Keyboard shortcut</strong>
        <span>Control–Option–B shows or hides Baton on macOS. In the control panel, <kbd>r</kbd> reloads and <kbd>R</kbd> restarts sessions in view.</span>
      </div>
      <div class="settings-foot">
        <span id="nativePreferenceStatus" aria-live="polite"></span>
        <button id="resetPreferences">Restore defaults</button>
        <button class="go" id="settingsDone">Done</button>
      </div>
    </div>
  </section>
</div>

<script>window.BATON_TOKEN='%%TOKEN%%';</script>
<script src="/assets/icons.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/settings.js"></script>
<script src="/assets/diagnostics.js"></script>
<script src="/assets/network.js"></script>
<script src="/assets/editor.js"></script>
<script src="/assets/workspace-pane.js"></script>
<script type="module" src="/assets/inspector.js"></script>
</body>
</html>
